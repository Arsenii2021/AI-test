[project]
name = "vision-qa"
version = "0.2.0"
description = "CNN-based UI state detection for automated tests of virtualization consoles"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Arsenii Kostenko" }]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.8,<5",
]

[project.optional-dependencies]
train = [
  "tensorflow>=2.15",
  "tf2onnx>=1.16",
]
capture = [
  "selenium>=4.15",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
vision-qa = "vision_qa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vision_qa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
